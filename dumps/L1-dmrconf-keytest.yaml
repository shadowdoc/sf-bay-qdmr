# AT-D168UV — HT-only deltas.
#
# Physical layout (per qdmr manual ch04s04 "Keypad settings" and the
# AT-D168UV operating manual's "Programmed Key" section): only two
# programmable buttons exist on this radio —
#   PF1 ("A") - first button below PTT  -> funcKeyA
#   PF2 ("B") - second button below PTT -> funcKeyB
# There's no numeric keypad, no C/D keys, and no knob, so funcKey1-6,
# funcKeyC/D and funcKnob are simply omitted here and inherit `Off` from
# base.yml — nothing to override.

radioIDs:
  - dmr: {id: id1, name: KR6A, number: 3197500}

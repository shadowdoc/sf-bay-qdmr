# L1 — dmrconf write-path test for the D168UV key slots (qdmr#1018).
# SCRATCH: base + d168uv overlay with only the six PF key functions changed.
# Inline key comments below are stale (inherited from the overlay).
# Restore the real codeplug afterwards with `just flash 168`.
#
# slot  key         YAML        correct (D168)   if libdmrconf bug
# +10   AShort      Squelch     0x37             0x38 (D878 short-key table)
# +11   BShort      SMS         0x0f             - (control)
# +12   ALong       RoamingSet  0x2a             0x2e (generic enum cast)
# +13   BLong       Reverse     0x04             0x07 (BVeryLong written here)
# +41   AVeryLong   Mute        0x2c             0x30 (generic enum cast)
# +42   BVeryLong   VOX         0x07             0x2a unchanged since E6
---
version: 0.15.1
settings:
  power: High
  defaultID: id1
  boot:
    display: Text
    message1: RETURN TO
    message2: " KR6A"
    passwordEnabled: false
    password: ""
    defaultChannel: true
    zoneA: zone2
    channelA: ch13
    zoneB: zone2
    channelB: ch16
    allowFactoryReset: true
  audio:
    squelch: 3
    dmrSquelch: none
    micGain: 10
    fmMicGain: none
    m17MicGain: none
    maxSpeakerVolume: 7
    maxHeadphoneVolume: 10
    vox: off
    voxDelay: 0
    speech: false
  tone:
    silent: false
    keyTone: 1
    smsTone: false
    ringtone: false
    bootTone: false
    bootMelody:
      bpm: 100
      melody: ""
    talkPermit:
      - None
    callStart:
      - Digital
    callStartMelody:
      bpm: 100
      melody: b'16 r b' r b'
    callEnd:
      - None
    callEndMelody:
      bpm: 100
      melody: fis'''16 r fis''' r fis'''
    channelIdle:
      - None
    channelIdleMelody:
      bpm: 100
      melody: b''16 r b'' r b''
    callReset: false
    callResetMelody:
      bpm: 100
      melody: fis'''16 r fis''' r fis'''
  gnss:
    fixedPositionEnabled: false
    fixedPosition: CM87sr93
    systems:
      - GPS
      - Glonass
      - Beidou
    units: Archaic
  dmr:
    privateCallMatch: true
    groupCallMatch: true
    privateCallHangTime: 1 s
    groupCallHangTime: 1 s
    sendTalkerAlias: false
    talkerAliasEncoding: Iso8
    preamble: 100 ms
  anytone:
    subChannel: true
    selectedVFO: A
    modeA: Memory
    modeB: Memory
    vfoScanType: Time
    minVFOScanFrequencyUHF: 400 MHz
    maxVFOScanFrequencyUHF: 480 MHz
    minVFOScanFrequencyVHF: 136 MHz
    maxVFOScanFrequencyVHF: 174 MHz
    keepLastCaller: false
    vfoStep: 5000 Hz
    steType: Off
    steFrequency: 0
    steDuration: 260 ms
    tbstFrequency: 1000 Hz
    proMode: false
    maintainCallChannel: false
    fan: Temperature
    bootSettings:
      priorityZoneA: zone1
      priorityZoneB: zone1
      gpsCheck: false
    powerSaveSettings:
      autoShutdown: 0
      resetAutoShutdownOnCall: false
      powerSave: Save50
      atpc: false
    keySettings:
      # --- Unused on this radio ---
      # Included to make roundtrip dyff more accurate
      funcKey1Short: Off
      funcKey1Long: Off
      funcKey2Short: Off
      funcKey2Long: Off
      funcKey3Short: Power
      funcKey3Long: Record
      funcKey4Short: Repeater
      funcKey4Long: SMS
      funcKey5Short: Reverse
      funcKey5Long: Dial
      funcKey6Short: Encryption
      funcKey6Long: Off
      # --- PF1 ("A"), first button below PTT ---  
      # PF1 short: cycle TX power (High/Mid/Low/...)
      # PF1 long:  toggle VFO <-> memory/channel mode
      funcKeyAShort: Squelch
      funcKeyALong: RoamingSet
      funcKeyAVeryLong: Mute
      # --- PF2 ("B"), second button below PTT ---
      # PF2 short: swap which VFO (A/B) is "main"/TX
      # PF2 long:  enable/disable sub-channel (dual-watch)
      funcKeyBShort: SMS
      funcKeyBLong: Reverse
      funcKeyBVeryLong: VOX
      funcKeyCShort: Off
      funcKeyCLong: Off
      funcKeyDShort: Off
      funcKeyDLong: Off
      funcKnobShort: Off
      funcKnobLong: Off
      # --- Global key-behavior settings ---
      # hold time before a press counts as "Long"
      # auto-lock keypad after inactivity
      # whether PF1/PF2 lock when key-lock engages
      # commercial-only "can't manually unlock" mode - leave false
      longPressDuration: 1 s
      upDownKeys: Channel
      autoKeyLock: false
      knobLock: false
      keypadLock: false
      sideKeysLock: false
      forcedKeyLock: false
    toneSettings:
      tot: false
      wxAlarm: false
    displaySettings:
      displayFrequency: false
      brightness: 10

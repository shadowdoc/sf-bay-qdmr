---
# AT-D168UV — HT-only deltas.
#
# Physical layout (per qdmr manual ch04s04 "Keypad settings" and the
# AT-D168UV operating manual's "Programmed Key" section): only two
# programmable buttons exist on this radio —
#   PF1 ("A") - first button below PTT  -> funcKeyA
#   PF2 ("B") - second button below PTT -> funcKeyB
# There's no numeric keypad, no C/D keys, and no knob, so funcKey1-6,
# funcKeyC/D and funcKnob are simply omitted here and inherit `Off` from
# base.yml — nothing to override.

settings:
  audio:
    micGain: 10
    fmMicGain: none
    m17MicGain: none
  tone:
    keyTone: 1
  anytone:
    keySettings:
      # --- Unused on this radio ---
      # Included to make roundtrip dyff more accurate
      funcKey1Short: Off
      funcKey1Long: Off
      funcKey2Short: Off
      funcKey2Long: Off
      funcKey3Short: Power
      funcKey3Long: Record
      funcKey4Short: Repeater
      funcKey4Long: SMS
      funcKey5Short: Reverse
      funcKey5Long: Dial
      funcKey6Short: Encryption
      funcKey6Long: Off

      # --- PF1 ("A"), first button below PTT ---  
      # PF1 short: cycle TX power (High/Mid/Low/...)
      # PF1 long:  toggle VFO <-> memory/channel mode
      funcKeyAShort: ToggleVFO
      funcKeyALong: Power
      funcKeyAVeryLong: Off

      # --- PF2 ("B"), second button below PTT ---
      # PF2 short: swap which VFO (A/B) is "main"/TX
      # PF2 long:  enable/disable sub-channel (dual-watch)
      funcKeyBShort: ToggleMainChannel
      funcKeyBLong: SubChannel
      funcKeyBVeryLong: Off

      # --- Global key-behavior settings ---
      # hold time before a press counts as "Long"
      # auto-lock keypad after inactivity
      # whether PF1/PF2 lock when key-lock engages
      # commercial-only "can't manually unlock" mode - leave false
      longPressDuration: 1 s
      autoKeyLock: false
      sideKeysLock: false
      forcedKeyLock: false
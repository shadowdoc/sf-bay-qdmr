---
# AT-D168UV — HT-only deltas.
#
# Physical layout (per qdmr manual ch04s04 "Keypad settings" and the
# AT-D168UV operating manual's "Programmed Key" section): only two
# programmable buttons exist on this radio —
#   PF1 ("A") - first button below PTT  -> funcKeyA
#   PF2 ("B") - second button below PTT -> funcKeyB
# There's no numeric keypad, no C/D keys, and no knob, so funcKey1-6,
# funcKeyC/D and funcKnob are simply omitted here and inherit `Off` from
# base.yml — nothing to override.

settings:
  tone:
    keyTone: 1
  anytone:
    keySettings:
      # --- PF1 ("A"), first button below PTT ---  
      funcKeyAShort: ToggleVFO                 # PF1 short: cycle TX power (High/Mid/Low/...)
      funcKeyALong: Off              # PF1 long:  toggle VFO <-> memory/channel mode
      funcKeyAVeryLong: Power

      # --- PF2 ("B"), second button below PTT ---      
      funcKeyBShort: ToggleMainChannel     # PF2 short: swap which VFO (A/B) is "main"/TX
      funcKeyBLong: SubChannel             # PF2 long:  enable/disable sub-channel (dual-watch)
      funcKeyBVeryLong: Off

      longPressDuration: 1 s   # hold time before a press counts as "Long"
      autoKeyLock: false       # auto-lock keypad after inactivity
      sideKeysLock: false      # whether PF1/PF2 lock when key-lock engages
      forcedKeyLock: false     # commercial-only "can't manually unlock" mode - leave false